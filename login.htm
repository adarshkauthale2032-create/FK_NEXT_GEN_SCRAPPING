    <script type="application/javascript" xml:space="preserve">
        /*<![CDATA[*/
        var idp = ['basic.fkldap'];
        var loginWithOtp = false;
        var clientId = 'sp-suv-ui';
        var loginUrl = "";
        var expireWarningDays = '4';


        if (idp !== null)
            idp = idp[0];
        var unifiedIdp = null;
        var error = null;

        $(document).ready(function () {
            if (unifiedIdp !== 'true' && (idp == null || idp === "")) {
                $('#myModal').modal({
                    backdrop: 'static',
                    keyboard: false
                })
            }
            function alignModal(){
                var modalDialog = $(this).find(".modal-dialog");

                // Applying the top margin on modal dialog to align it vertically center
                modalDialog.css("margin-top", Math.max(0, ($(window).height() - modalDialog.height()) / 2));
            }
            // Align modal when it is displayed
            $(".modal").on("shown.bs.modal", alignModal);

            // Align modal when user resize the window
            $(window).on("resize", function(){
                $(".modal:visible").each(alignModal);
            });
            var domains = ["flipkart.com", "partner.flipkart.com"];
            $('#username').autocomplete({
                source: function (request, callback) {
                    var idx = request.term.indexOf('@');
                    if (idx !== -1) {
                        callback(domains.map(function (domain) { return request.term.substring(0, idx) + "@" + domain } ));
                    } else {
                        callback([])
                    }
                }
            });
            if (clientId != null && idp != null) {
                loginUrl = "/loginOTP?idp=" + idp + "&client_id=" + clientId;
                $("#loginOTP").attr("href", loginUrl);
            } else {
                $("#loginOTP").hidden = true;
            }
        });

        function insertMultipleParams(key, value, kvp) {
            key = encodeURI(key); value = encodeURI(value);

            if (kvp === '') {
                return '?' + key + '=' + value;
            }
            else {
                kvp = kvp.substr(1).split("&");
                var i = kvp.length; var x; while (i--) {
                    x = kvp[i].split('=');

                    if (x[0] === key) {
                        x[1] = value;
                        kvp[i] = x.join('=');
                        break;
                    }
                }

                if (i < 0) { kvp[kvp.length] = [key, value].join('='); }

                //this will reload the page, it's likely better to store this until finished
                return '?' + kvp.join("&");
            }
        }

        function setIdp(value) {
            var kvp = insertMultipleParams("idp", value, document.location.search);
            kvp = insertMultipleParams("show_choices", true, kvp);
            document.location.search = kvp;
        }
        /*]]>*/
    </script>
